/* Layout: kockás füzetlap, egy oszlop telefonra; filctollal rajzolt, kissé ferde elemek, FelViki (ceruza-figura) beszédbuborékokban beszél. Szándékosan egy világos "füzet" világ. */
:root{
  color-scheme:light;
  --paper:#fffdf5; --grid:#dbe7f6; --margin:#f4a3b4; --ink:#26262e; --soft:#5f5b6e;
  --yellow:#ffd94a; --pink:#ff7a9c; --blue:#4a8fe7; --green:#33b97f; --orange:#ff9f43; --purple:#9b7bea;
  --ok:#1f9d63; --ok-bg:#dcf6e8; --bad:#e04848; --bad-bg:#ffe3e3;
  --hand:"Caveat","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  --body:"Patrick Hand","Segoe Print","Comic Sans MS",system-ui,sans-serif;
  --sk:255px 18px 225px 18px/18px 225px 18px 255px;
  --sk2:18px 225px 18px 255px/255px 18px 225px 18px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--paper);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;position:relative}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px 8px;display:flex;align-items:center;gap:10px;border-bottom:2.5px dashed var(--ink)}
header .home{font-family:var(--hand);font-weight:700;font-size:28px;background:none;border:0;color:var(--ink);padding:0;cursor:pointer;text-align:left;min-width:0;line-height:1}
header .home span{background:linear-gradient(100deg,transparent 2%,var(--yellow) 4%,var(--yellow) 94%,transparent 97%);background-size:100% 55%;background-repeat:no-repeat;background-position:0 85%}
header .right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:16px;color:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.nb{font:inherit;font-size:18px;color:var(--ink);border:2px solid var(--ink);border-radius:var(--sk);background:#fff;padding:3px 12px;box-shadow:2px 3px 0 var(--ink);cursor:pointer;min-height:40px}
.nb.x{background:#ffe6ee}
.nb:active{transform:translate(1px,2px);box-shadow:1px 1px 0 var(--ink)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(38,38,46,.35);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .say{max-width:440px;width:100%}
@media (max-width:360px){header .right .cnt{display:none}}
h1,h2,h3{font-family:var(--hand);font-weight:700;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:44px}
h2{font-size:32px}
.muted{color:var(--soft)}
.small{font-size:16px}
section{display:flex;flex-direction:column;gap:16px;padding-top:18px}
svg.doodle{overflow:visible}
.wob{filter:url(#wobble)}
.btn{font:inherit;font-size:20px;border-radius:var(--sk);border:2.5px solid var(--ink);background:var(--yellow);color:var(--ink);padding:10px 16px;cursor:pointer;min-height:50px;box-shadow:3px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px) rotate(-.6deg);box-shadow:5px 6px 0 var(--ink)}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost,.btn.plain{background:#fff}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,input:focus-visible,.tile:focus-visible,.card:focus-visible{outline:3px dashed var(--blue);outline-offset:4px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}

/* Kezdőlap: FelViki + buborék */
.hero{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:end}
.hero .fv{width:96px}
.bubble{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:var(--sk2);padding:12px 16px;box-shadow:3px 4px 0 var(--ink)}
.bubble::before{content:"";position:absolute;left:-14px;bottom:20px;width:18px;height:18px;background:#fff;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:skewY(-30deg) rotate(20deg)}
.bubble h1{font-size:46px}
.bubble p{margin:4px 0 0;font-size:20px}

.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.chip{flex:0 0 auto;font:inherit;font-size:17px;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:var(--sk);padding:4px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;transform:rotate(-1.5deg)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{padding:10px 10px 12px;box-shadow:2px 4px 0 rgba(38,38,46,.18);position:relative}
.stat:nth-child(1){background:#fff3a8;transform:rotate(-2deg)}

.tile .small{color:var(--soft);line-height:1.2}
.tile .ic{width:42px;height:42px;display:block;margin-bottom:2px}
.tile .ic svg{width:100%;height:100%}
.tile.main{grid-column:1/-1;background:var(--yellow);min-height:0;padding:16px 80px 16px 16px}

.tile.wide{grid-column:1/-1;min-height:0;padding-right:70px}

.progress{height:14px;border:2px solid var(--ink);border-radius:var(--sk);background:#fff;overflow:hidden}

    ${extra}

  read: c => S('0 0 70 100', `<circle cx="22" cy="16" r="10" fill="#fff"/><path d="M19 14 l0 1 M27 14 l0 1 M19 20 l6 0"/><path d="M22 26 L22 62 M22 38 L40 44 M22 44 L40 50 M22 62 L10 90 M22 62 L34 90"/><path d="M38 34 L62 30 L62 54 L38 58 Z" fill="${c}"/><path d="M50 32 L50 56" stroke-width="2"/>`),
  wave: c => S('0 0 60 100', `<circle cx="30" cy="16" r="10" fill="#fff"/><path d="M26 15 l0 1 M34 15 l0 1 M25 20 Q30 24 35 20"/><path d="M30 26 L30 62 M30 38 L14 54 M30 38 L46 22 M30 62 L18 90 M30 62 L42 90 M50 14 q4 4 0 8 M54 10 q7 8 0 16" stroke="${c}"/>`),
};
const doodle = {
  star: (c = '#ffd94a') => S('0 0 40 40', `<path d="M20 3 l5 11 l12 1.5 l-9 8 l2.5 12 l-10.5 -6 l-10.5 6 l2.5 -12 l-9 -8 l12 -1.5 Z" fill="${c}"/>`),
  heart: (c = '#ff7a9c') => S('0 0 40 40', `<path d="M20 34 C4 22 4 8 13 7 C17 6 19 9 20 12 C21 9 23 6 27 7 C36 8 36 22 20 34 Z" fill="${c}"/>`),
  arrow: () => S('0 0 80 40', `<path d="M4 30 C20 4 40 36 60 14 M60 14 l-10 0 M60 14 l-1 10"/>`),
  bolt: (c = '#ff9f43') => S('0 0 40 40', `<path d="M22 3 L8 22 L19 22 L15 37 L32 15 L21 15 Z" fill="${c}"/>`),

const WOBBLE = `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter></svg>`;

function confetti() {

// ---------- FelViki mondatai ----------
const PRAISE = ['Szuper, Zsófi!', 'Telitalálat!', 'Ez az!', 'Pontosan!', 'Ügyes vagy!', 'Profi!', 'Hibátlan!', 'Nagyon megy ez!', 'Bravó!', 'Így kell ezt!', 'Zseniális!', 'Igen, igen, igen!', 'Látom, ez már megy!', 'Ez könnyen ment!'];
const ENCOURAGE = ['Semmi baj, most megtanultad!', 'Majdnem! Jegyezd meg ezt:', 'Ebből tanulunk, legközelebb menni fog!', 'Nem gond, ezért gyakorlunk!', 'Hoppá! Nézzük meg együtt:', 'Ez trükkös volt. Figyelj:', 'Ne aggódj, ez a következőre már megy!'];
const STREAK = { 3: 'Három egymás után! Lendületben vagy!', 5: 'Öt jó válasz zsinórban! Megállíthatatlan vagy!', 7: 'Hét a sorban! Ez már varázslat!', 10: 'Tíz egymás után! Ez elképesztő, Zsófi!' };
function resultPraise(pct, prevPct) {
  const tiers = pct === 100 ? ['TÖKÉLETES! Minden válasz jó, nagyon büszke vagyok rád!', 'Hibátlan kör! Te vagy a felvételi bajnoka!', 'Minden pont a tiéd! Erre csak azt tudom mondani: WOW!']
    : pct >= 80 ? ['Fantasztikus eredmény! Már majdnem minden megy!', 'Hű, ez nagyon jó lett! Így tovább!', 'Szuper vagy! Ezzel a tudással nyugodtan mehetsz a felvételire!']
    : pct >= 60 ? ['Szép munka! Több mint a fele jó, és ez egyre jobb lesz!', 'Ügyes voltál! Pár dolgot még átnézünk, és meglesz!', 'Jó úton vagy, Zsófi! Csak így tovább!']
    : pct >= 40 ? ['Jól haladsz! A hibákból tanulunk a legtöbbet.', 'Nem rossz! Nézzük át a hibákat, és a következő még jobb lesz!', 'Szép próbálkozás! Gyakoroljunk még egy kicsit!']
    : ['Semmi baj! Minden hiba egy lépés előre. Nézzük át együtt!', 'Ne add fel! A kártyákkal gyorsan belejössz, aztán újra próbáljuk!', 'Az elején mindenki így kezdi. Gyakoroljunk, és menni fog!'];
  let msg = pick(tiers);
  if (prevPct != null && pct > prevPct) msg += ` Ráadásul ${pct - prevPct} százalékponttal jobb, mint legutóbb!`;
  return msg;
}

      : `<span>Chrome-ban: jobb fent ⋮ → „Alkalmazás telepítése” vagy „Hozzáadás a kezdőképernyőhöz” → <b>Telepítés</b> (ne a „Parancsikon”-t válaszd). Utána a kezdőképernyőn lévő ikonról indíts.</span>`}</div></div>`;
}
const LS_KEY = 'zsofi-felveteli-progress-v1';

let KB = null, cardById = {}, catName = {};
let catFilter = 'all';
let P = { items: {}, sessions: [], updated: 0 };   // haladás
let db = null, userApi = null, myId = null, isOwner = false, dbWritable = true, saveTimer = null;

// ---------- Haladás ----------
const it = id => (P.items[id] ||= { b: 0, r: 0, w: 0, t: 0 });   // b: doboz (0 = új, 1 = gyakorolni, ... 5 = tudja)
function mark(id, correct) {
  const x = it(id);
  if (correct) { x.r++; x.b = Math.min(5, (x.b || 1) + 1); } else { x.w++; x.b = 1; }
  x.t = Date.now(); save();
}
function loadLocal() { try { const s = localStorage.getItem(LS_KEY); if (s) P = JSON.parse(s); } catch (e) {} P.items ||= {}; P.sessions ||= []; }
function save() {
  P.updated = Date.now();

  if (db && myId && dbWritable) { clearTimeout(saveTimer); saveTimer = setTimeout(pushRemote, 1200); }
}
async function pushRemote() {
  try { await db.doc('progress/' + myId).set({ items: P.items, sessions: P.sessions.slice(-60), updated: P.updated }); }
  catch (e) { if (e && e.code === 'invalid_argument') dbWritable = false; }
  renderHeader();
}
async function initCloud() {
  try {
    const [d, u] = await Promise.all([window.claude?.use?.('db'), window.claude?.use?.('user')]);
    db = d; userApi = u;
    if (!db || !userApi) { renderHeader(); return; }
    myId = await userApi.id(); isOwner = await userApi.isOwner();
    const w = await userApi.can?.('data.write'); if (w === false) dbWritable = false;
    if (myId) {
      const snap = await db.doc('progress/' + myId).get();
      const r = snap.exists ? snap.data() : null;
      if (r && (r.updated || 0) > (P.updated || 0)) { P = { items: r.items || {}, sessions: r.sessions || [], updated: r.updated }; try { localStorage.setItem(LS_KEY, JSON.stringify(P)); } catch (e) {} }
      else if (Object.keys(P.items).length && dbWritable) pushRemote();

}

// ---------- Kiválasztás ----------
const inCat = x => catFilter === 'all' || x.cat === catFilter;
function priority(id) { const x = P.items[id]; if (!x || !x.b) return 2; return x.b === 1 ? 0 : 1 + x.b; }  // 0 hibás, 2 új, 3+ tudott
function pickQuestions(n, onlyWrong) {
  let pool = KB.questions.filter(inCat);
  if (onlyWrong) pool = pool.filter(q => P.items[q.id]?.b === 1);
  const groups = {};
  shuffle(pool).forEach(q => (groups[priority(q.id)] ||= []).push(q));
  const out = []; const usedCards = new Set();
  for (const k of Object.keys(groups).sort((a, b) => a - b)) for (const q of groups[k]) {
    if (out.length >= n) break;
    if (usedCards.has(q.card) && pool.length > n * 2) continue;   // ne legyen két kérdés ugyanarról
    out.push(q); usedCards.add(q.card);
  }
  return shuffle(out);
}
function buildAuto(q) {
  const c = cardById[q.card];
  const others = shuffle(KB.cards.filter(o => o.cat === c.cat && o.id !== c.id)).slice(0, 3).map(o => o.term);
  return { ...q, prompt: 'Melyik fogalom meghatározása ez?', def: q.q, options: shuffle([c.term, ...others]), correct: c.term };
}
function prep(q) {
  if (q.type === 'mcauto') return buildAuto(q);
  if (q.type === 'mc') return { ...q, prompt: q.q, options: shuffle(q.options), correct: q.options[q.answer] };
  return { ...q, prompt: q.q };
}
const norm = s => s.trim().replace(/\s+/g, ' ').toLocaleLowerCase('hu');
const checkFill = (q, v) => q.accept.some(a => norm(a) === norm(v));

// ----- Kvíz -----
let quiz = null;
function startQuiz(onlyWrong) {
  const qs = pickQuestions(QUIZ_LEN, onlyWrong).map(prep);
  if (!qs.length) { goHome(); return; }
  quiz = { qs, i: 0, answers: [], streak: 0, best: 0, onlyWrong };
  go('quiz', renderQ);
}
function renderQ() {
  const q = quiz.qs[quiz.i];
  const isFill = q.type === 'fill';
  view.innerHTML = `<section>
    <div class="row" style="align-items:center;justify-content:space-between">
      <span class="small muted" style="font-variant-numeric:tabular-nums">${quiz.i + 1}. kérdés / ${quiz.qs.length}</span>
      ${quiz.streak >= 2 ? `<span class="streak">${quiz.streak} jó zsinórban!</span>` : ''}
    </div>
    <div class="progress"><i style="width:${100 * quiz.i / quiz.qs.length}%"></i></div>
    <div class="q">
      <span class="tag">${esc(catName[q.cat])} · ${isFill ? 'Írd be a választ' : 'Válaszd ki'}</span>
      <div class="prompt">${esc(q.prompt)}</div>
      ${q.def ? `<p style="margin:0" class="hl-box"><span class="hl">${esc(q.def)}</span></p>` : ''}
      ${isFill
        ? `<form id="fillForm" class="opts"><label class="small muted" for="fillIn">A válaszod (pontosan, helyes ékezetekkel)</label><input type="text" id="fillIn" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" type="submit">Ellenőrzés</button></form>`
        : `<div class="opts">${q.options.map((o, k) => `<button class="opt" type="button" data-k="${k}">${esc(o)}</button>`).join('')}</div>`}
      <div id="fb"></div>
    </div>
  </section>`;
  if (isFill) {
    const inp = $('#fillIn'); inp.focus({ preventScroll: true });
    $('#fillForm').onsubmit = e => { e.preventDefault(); if (!inp.value.trim()) return; answer(inp.value, checkFill(q, inp.value)); inp.disabled = true; e.target.querySelector('button').remove(); };
  } else {
    view.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const val = q.options[+b.dataset.k], ok = val === q.correct;
      view.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (q.options[+x.dataset.k] === q.correct) x.classList.add('right'); });
      if (!ok) b.classList.add('wrong');
      answer(val, ok);
    });
  }
}
function answer(given, ok) {
  const q = quiz.qs[quiz.i];
  quiz.answers.push({ q, given, ok });
  quiz.streak = ok ? quiz.streak + 1 : 0; quiz.best = Math.max(quiz.best, quiz.streak);
  mark(q.id, ok);
  const right = q.type === 'fill' ? q.accept.join(' / ') : q.correct;
  const st = ok ? STREAK[quiz.streak] : null;
  if (st && quiz.streak >= 5) confetti();
  $('#fb').innerHTML = `<div class="say"><div class="${ok ? 'bob' : ''}">${felviki(ok ? (st ? 'cheer' : 'happy') : 'comfort')}</div>
    <div class="fb ${ok ? 'ok' : 'bad'} pop" role="status">
      <b class="k">${ok ? (st || pick(PRAISE)) : pick(ENCOURAGE)}</b>
      ${ok ? '' : `<span>Helyes válasz: <b class="hl">${esc(right)}</b></span>`}
      <span>${esc(q.expl)}</span></div></div>
    <button class="btn" id="next" type="button" style="margin-top:12px;width:100%">${quiz.i + 1 < quiz.qs.length ? 'Következő →' : 'Lássuk az eredményt!'}</button>`;
  const nx = $('#next'); nx.focus({ preventScroll: true });
  nx.onclick = () => { quiz.i++; if (quiz.i < quiz.qs.length) renderQ(); else finishQuiz(); };
}
function finishQuiz() {
  const s = quiz.answers.filter(a => a.ok).length, n = quiz.answers.length;
  const prev = [...P.sessions].reverse().find(x => x.w === (quiz.onlyWrong ? 1 : 0) && x.c === catFilter);
  P.sessions.push({ d: Date.now(), s, n, c: catFilter, w: quiz.onlyWrong ? 1 : 0 }); save();
  const pct = Math.round(100 * s / n);
  const msg = resultPraise(pct, prev ? Math.round(100 * prev.s / prev.n) : null);
  const mood = pct >= 80 ? 'cheer' : pct >= 50 ? 'happy' : 'comfort';
  current = 'result'; renderHeader();
  view.innerHTML = `<section>
    <div class="result-top"><div><span class="tag">Kiértékelés</span><div class="score pop">${s}/${n}</div></div><div class="bob">${felviki(mood)}</div></div>
    <div class="fb ${pct >= 50 ? 'ok' : 'bad'} pop" style="border-radius:var(--sk)"><p class="praise">${esc(msg)}</p>${quiz.best >= 3 ? `<span>Leghosszabb sorozatod: <b>${quiz.best} jó válasz</b> egymás után!</span>` : ''}</div>
    ${pct >= 80 ? `<div class="scene" aria-hidden="true">${stick.cheer('#ffd94a')}${stick.jump('#ff7a9c')}${stick.flag('#33b97f')}${stick.cheer('#4a8fe7')}</div>` : ''}
    <div class="row"><button class="btn" id="again" type="button">Még egy kör!</button><button class="btn ghost" id="wrongs" type="button" ${s < n ? '' : 'disabled'}>Hibák újra</button></div>
    <h2>Nézzük meg együtt!</h2>
    <div class="list">${quiz.answers.map((a, k) => {
      const right = a.q.type === 'fill' ? a.q.accept.join(' / ') : a.q.correct;
      return `<div class="item ${a.ok ? 'okk' : 'badd'}">
        <span class="tag">${k + 1}. · ${a.ok ? 'Helyes' : 'Hibás'}</span>
        <b>${esc(a.q.prompt)}</b>${a.q.def ? `<span class="small">${esc(a.q.def)}</span>` : ''}
        <span>Te: <b>${esc(a.given)}</b>${a.ok ? '' : ` · Helyes: <b>${esc(right)}</b>`}</span>
        <span class="small muted">${esc(a.q.expl)}</span></div>`; }).join('')}</div>
  </section>`;
  $('#again').onclick = () => startQuiz(false);
  $('#wrongs').onclick = () => startQuiz(true);
  window.scrollTo({ top: 0 }); renderHeader();
  if (pct >= 80) setTimeout(confetti, 250);
}

function catStats(items) {
  return KB.categories.map(c => {
    const qs = KB.questions.filter(q => q.cat === c.id);
    let r = 0, w = 0; qs.forEach(q => { const x = items[q.id]; if (x) { r += x.r; w += x.w; } });
    return { name: c.name, r, w, tried: qs.filter(q => items[q.id]).length, total: qs.length };
  }).filter(x => x.total);
}
function statsBlock(data) {
  const cs = catStats(data.items || {});
  const missed = KB.questions.filter(q => data.items?.[q.id]?.w).sort((a, b) => data.items[b.id].w - data.items[a.id].w).slice(0, 8);
  const sess = (data.sessions || []).slice(-8).reverse();
  return `<div class="list">${cs.map(x => { const p = x.r + x.w ? Math.round(100 * x.r / (x.r + x.w)) : 0; return `<div class="bar"><span>${esc(x.name)} <span class="small muted">(${x.tried}/${x.total})</span></span><div class="progress"><i style="width:${p}%"></i></div><span>${x.r + x.w ? p + '%' : '–'}</span></div>`; }).join('')}</div>
    <h2>Legtöbbször rontott</h2>
    ${missed.length ? `<div class="list">${missed.map(q => `<div class="item"><span class="tag">${esc(cardById[q.card]?.term)} · ${data.items[q.id].w}× rossz</span><span>${esc(q.type === 'mcauto' ? q.q : q.q)}</span></div>`).join('')}</div>` : '<p class="muted">Még nincs rontott kérdés.</p>'}
    <h2>Legutóbbi kvízek</h2>
    ${sess.length ? `<div class="list">${sess.map(x => `<div class="bar"><span>${new Date(x.d).toLocaleString('hu-HU', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}${x.w ? ' · hibák' : ''}</span><div class="progress"><i style="width:${100 * x.s / x.n}%"></i></div><span>${x.s}/${x.n}</span></div>`).join('')}</div>` : '<p class="muted">Még nem volt kvíz.</p>'}`;
}
async function renderStats() {
  let tr = 0, tw = 0; Object.entries(P.items).forEach(([k, x]) => { if (!k.startsWith('c:')) { tr += x.r; tw += x.w; } });
  const acc = tr + tw ? Math.round(100 * tr / (tr + tw)) : null;
  const statMsg = acc == null ? 'Még nincs eredményed. Indíts egy kvízt, és itt fogod látni, mennyit fejlődsz!'
    : acc >= 80 ? `Eddig ${tr} jó válaszod van, ${acc}% pontossággal. Ez kiváló, Zsófi, nagyon büszke vagyok rád!`
    : acc >= 60 ? `Eddig ${tr} jó válaszod van (${acc}%). Szépen fejlődsz, csak így tovább!`
    : `Eddig ${tr} jó válaszod van. Minden gyakorlással jobb leszel, és én itt vagyok, hogy segítsek!`;
  view.innerHTML = `<section><h1>Eredmények</h1>
    <div class="say"><div class="bob">${felviki(acc != null && acc >= 80 ? 'cheer' : 'happy')}</div><div class="fb ok pop"><span>${statMsg}</span></div></div>
    ${statsBlock(P)}<div id="others"></div>
    ${window.claude ? '' : `<h2>Biztonsági mentés</h2>
    <p class="small muted" style="margin:0">A haladásod ebben a böngészőben tárolódik. Időnként mentsd el fájlba, és ha új telefonra váltasz vagy törlődnek a böngészőadatok, töltsd vissza.</p>
    <div class="row"><button class="btn plain" id="bkSave" type="button">Mentés fájlba</button><label class="btn plain" for="bkLoad" style="text-align:center">Visszatöltés fájlból</label><input type="file" id="bkLoad" accept="application/json,.json" hidden></div>
    <div id="bkMsg"></div>`}
    <button class="btn plain" id="reset" type="button">Saját haladás törlése</button><div id="resetConfirm"></div></section>`;
  if ($('#bkSave')) {
    $('#bkSave').onclick = () => {
      const blob = new Blob([JSON.stringify({ app: 'zsofi-felveteli', v: 1, saved: Date.now(), progress: P })], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'felveteli-haladas-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      $('#bkMsg').innerHTML = '<p class="small muted">A mentés elkészült (a Letöltések mappában keresd).</p>';
    };
    $('#bkLoad').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const d = JSON.parse(await f.text());
        if (d.app !== 'zsofi-felveteli' || !d.progress || typeof d.progress.items !== 'object') throw new Error('format');
        P = { items: d.progress.items || {}, sessions: d.progress.sessions || [], updated: 0 }; save(); renderStats();
      } catch (err) { $('#bkMsg').innerHTML = '<div class="fb bad"><span>Ez nem a felvételi gyakorló mentésfájlja. Válaszd ki a „felveteli-haladas-….json” fájlt.</span></div>'; }
    };
  }
  $('#reset').onclick = () => {
    $('#resetConfirm').innerHTML = `<div class="fb bad"><span>Biztosan törlöd az összes eredményedet? Ez nem vonható vissza.</span><div class="row"><button class="btn plain" id="rNo" type="button">Mégse</button><button class="btn" id="rYes" type="button">Törlés</button></div></div>`;
    $('#rNo').onclick = () => $('#resetConfirm').innerHTML = '';
    $('#rYes').onclick = () => { P = { items: {}, sessions: [], updated: 0 }; save(); renderStats(); };
  };
  if (!(db && isOwner)) return;
  try {
    const snap = await db.collection('progress').get();
    const others = snap.docs.filter(d => d.id !== myId);
    if (!others.length) return;
    const ps = await userApi.profiles(others.map(d => d.id));
    $('#others').innerHTML = others.map(d => `<details class="kb" style="margin-top:12px"><summary>${esc(ps?.[d.id]?.name || 'Másik felhasználó')} eredményei</summary><div style="display:flex;flex-direction:column;gap:14px;margin-top:12px">${statsBlock(d.data() || {})}</div></details>`).join('');
  } catch (e) {}
}

// ----- Tudástár -----
function renderKb() {
  const draw = () => {
    const term = ($('#kbSearch')?.value || '').toLocaleLowerCase('hu');
    const list = KB.cards.filter(inCat).filter(c => !term || (c.term + ' ' + c.def + ' ' + c.use).toLocaleLowerCase('hu').includes(term));
    $('#kbList').innerHTML = list.length ? list.map(c => `<details class="kb"><summary>${esc(c.term)} <span class="small muted">· ${esc(catName[c.cat])}</span></summary><p>${esc(c.def)}</p>${c.use ? `<p class="muted">${esc(c.use)}</p>` : ''}<p class="small muted">${KB.questions.filter(q => q.card === c.id).length} kérdés kapcsolódik hozzá</p></details>`).join('') : '<p class="muted">Nincs találat.</p>';
  };
  view.innerHTML = `<section><h1>Tudástár</h1>${chipsHtml()}<label class="small muted" for="kbSearch">Keresés</label><input type="text" id="kbSearch" placeholder="pl. jelző, rím, szólás"><div class="list" id="kbList"></div><p class="small muted">Tudástár verzió: ${esc(KB.version)}</p></section>`;
  bindChips(renderKb); $('#kbSearch').oninput = draw; draw();
}

// ---------- Indítás ----------
$('#homeBtn').onclick = () => { if (quizInProgress()) askExitQuiz(); else goHome(); };
loadLocal();
fetch('tudastar.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
  KB = d; KB.cards.forEach(c => cardById[c.id] = c); KB.categories.forEach(c => catName[c.id] = c.name);
  let seen = false; try { seen = localStorage.getItem('zsofi-help-seen') === '1'; localStorage.setItem('zsofi-help-seen', '1'); } catch (e) { seen = true; }
  if (seen) go('home', renderHome); else go('help', renderHelp);
  initCloud();
}).catch(() => { view.innerHTML = `<section><h1>Nem sikerült betölteni a tudástárat</h1><p class="muted">Ellenőrizd az internetkapcsolatot, majd töltsd újra az oldalt.</p></section>`; });
})();
</script>

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
